name: Waka Readme

on:
  workflow_dispatch:
  schedule:
    # Runs nightly at 23:55 UTC
    - cron: '55 23 * * *'

jobs:
  update-readme:
    name: Update this repo's README
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: Drewlius/waka-readme-stats@main
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SHOW_PROJECTS: "True"
          SHOW_OS: "True"
          SHOW_EDITORS: "True"
          SHOW_LANGUAGE_PER_REPO: "True"
          SHOW_SHORT_INFO: "True"
          IGNORED_REPOS: "waka-readme-stats"
          SHOW_TiMEZONE: "False"
          SHOW_COMMIT: "True"
          SHOW_DAYS_OF_WEEK: "True"
          SHOW_LINES_OF_CODE: "False"
          SHOW_LOC_CHART: "True"
          SHOW_CATEGORIES: "True"
          LOCALE: "en"
          SYMBOL_VERSION: "2"
          BADGE_STYLE: "for-the-badge"
          UPDATED_DATE_FORMAT: "%B %d, %Y %H:%M:%S"
