name: Waka Readme

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC-only. 04:55 UTC = 23:55 Eastern (EST). During EDT months
    # it fires at 00:55 local, one day behind by minutes — re-sync to '55 3 * * *'
    # in March if you care about exact DST alignment.
    - cron: '55 4 * * *'

jobs:
  update-readme:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Configure git auth
        run: |
          git config --global user.name "Drewlius"
          git config --global user.email "drewrichburg97@icloud.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/Drewlius/Drewlius"

      - uses: Drewlius/waka-readme-stats@main
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SHOW_PROJECTS: "False"
          SHOW_COMMIT: "False"
          SHOW_DAYS_OF_WEEK: "False"
          SHOW_LINES_OF_CODE: "False"
          SHOW_LOC_CHART: "False"
          SHOW_CATEGORIES: "True"
          LOCALE: "en"
          UPDATED_DATE_FORMAT: "%B %d, %Y %H:%M:%S"
