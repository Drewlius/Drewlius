name: Waka Readme

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC-only. 04:55 UTC = 23:55 Eastern (EST). During EDT
    # months it fires at 00:55 local; re-sync to '55 3 * * *' in March.
    - cron: '55 4 * * *'

jobs:
  update-readme:
    name: Update this repo's README
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: Drewlius/waka-readme-stats@main
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SHOW_PROJECTS: "True"
          SHOW_OS: "True"
          SHOW_EDITORS: "True"
          SHOW_LANGUAGE_PER_REPO: "True"
          SHOW_SHORT_INFO: "True"
          IGNORED_REPOS: "waka-readme-stats"
          SHOW_TiMEZONE: "False"
          # Commit-graph queries hang the run (see Nov 3-6 timeouts); keep off.
          SHOW_COMMIT: "False"
          SHOW_DAYS_OF_WEEK: "False"
          SHOW_LINES_OF_CODE: "False"
          SHOW_LOC_CHART: "False"
          SHOW_CATEGORIES: "True"
          LOCALE: "en"
          SYMBOL_VERSION: "2"
          BADGE_STYLE: "for-the-badge"
          UPDATED_DATE_FORMAT: "%B %d, %Y %H:%M:%S"
