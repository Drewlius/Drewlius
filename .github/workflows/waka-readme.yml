name: Waka Readme Stats

on:
  schedule:
    # Runs every day at 18:30 UTC
    - cron: "30 18 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    name: Update README with WakaTime statistics
    runs-on: ubuntu-latest

    steps:
      - name: Update WakaTime statistics
        uses: anmol098/waka-readme-stats@v5
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SECTION_NAME: waka
